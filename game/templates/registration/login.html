{% extends "game/base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<section class="auth-form">
    <h1>Connexion</h1>

    {% if form.errors %}
        <p class="alert alert--error">Identifiants incorrects. Merci de réessayer.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <p><a href="{% url 'game:signup' %}">Pas encore de compte ? Inscrivez-vous</a></p>
</section>
{% endblock %}
