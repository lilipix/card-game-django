[project]
name = "card-game-django"
version = "0.1.0"
description = "A Django card game platform with Docker and CI support"
readme = "README.md"
authors = [
    { name = "Aurélie", email = "aurelie.demure.ad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.4",
    "gunicorn>=23.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
card-game-django = "card_game_django:main"

[tool.ruff]
line-length = 100
extend-exclude = ["game/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["RUF012"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
