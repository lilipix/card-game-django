name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Linter (Ruff)
        run: ruff check .

      # Génération d'un fichier .env complet pour Docker Compose
      - name: Create .env file for Docker
        run: |
          echo "POSTGRES_DB=cardgame_db" >> .env
          echo "POSTGRES_USER=root" >> .env
          echo "POSTGRES_PASSWORD=root" >> .env
          echo "SECRET_KEY=django-insecure-ci-key-for-tests" >> .env
          echo "DEBUG=True" >> .env

      - name: Clean up Docker resources
        if: always()
        run: docker compose down -v --remove-orphans